# ==============================================================================
# Nginx Virtual Host Configuration - eOSIS SMP Negeri 2 Bogor
# Lokasi file di VPS Ubuntu: /etc/nginx/sites-available/eosis
# ==============================================================================

server {
    listen 80;
    server_name osis.smpn2bogor.sch.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name osis.smpn2bogor.sch.id;

    # SSL Certificate (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/osis.smpn2bogor.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osis.smpn2bogor.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root direktori menunjuk ke folder public Laravel
    root /var/www/eosis/public;
    index index.html index.php;

    charset utf-8;

    # Maksimalkan ukuran upload untuk Import Siswa Massal & Foto Kandidat
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip Compression untuk performa cepat saat diakses ribuan siswa
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Routing SPA Frontend dan API Backend
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # PHP-FPM Processor
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Sesuaikan dengan versi PHP (misal php8.3-fpm)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Blokir akses ke file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
